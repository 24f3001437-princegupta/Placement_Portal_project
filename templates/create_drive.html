<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create a Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 px-4 shadow-sm">
        <span class="navbar-brand mb-0 h1"> Company Dashboard</span>
        <a href="/login" class="btn btn-danger btn-sm">Log Out</a>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-normal">Create a Drive</h4>
            </div>
            <div class="card-body bg-light p-4">
                <form action="/create_drive/{{ current_user.id }}" method="POST">
                    <div class="row mb-3 align-items-center">
                        <div class="col-4 text-end text-muted">Drive Name</div>
                        <div class="col-8"><input type="text" class="form-control" name="drive_name" required></div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <div class="col-4 text-end text-muted">Job Title</div>
                        <div class="col-8"><input type="text" class="form-control" name="job_title" required></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-4 text-end text-muted mt-2">Job Description</div>
                        <div class="col-8"><textarea class="form-control" name="description" rows="4" required></textarea></div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <div class="col-4 text-end text-muted">Eligibility Criteria</div>
                        <div class="col-8"><input type="text" class="form-control" name="eligibility" required></div>
                    </div>
                    <div class="row mb-4 align-items-center">
                        <div class="col-4 text-end text-muted">Application Deadline</div>
                        <div class="col-8"><input type="date" class="form-control" name="deadline" required></div>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-outline-success px-4">save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
