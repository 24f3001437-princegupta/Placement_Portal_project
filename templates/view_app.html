<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 px-4 shadow-sm">
        <span class="navbar-brand mb-0 h1">🎓 Company Dashboard</span>
        <a href="/login" class="btn btn-danger btn-sm">Log Out</a>
    </nav>

    <div class="container" style="max-width: 700px;">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h4 class="mb-1 fw-normal">Update Applications for the Drive</h4>
                <p class="mb-0 text-muted">Job Title: {{ drive.job_title }}</p>
            </div>
            <div class="card-body p-0">
                <h6 class="p-3 mb-0 text-muted bg-light border-bottom">Received Applications</h6>
                <table class="table table-hover mb-0">
                    <tbody>
                        {% for app in applications %}
                        <tr>
                            <td class="align-middle px-3 text-muted border-end" style="width: 70%;">{{ app.student.full_name }}</td>
                            <td class="text-center align-middle">
                                <a href="/review_student/{{ app.id }}" class="btn btn-outline-primary btn-sm px-3 rounded-pill">review application</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="2" class="text-center py-4 text-muted">No applications received yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white text-end py-3">
                <a href="/home/{{ current_user.id }}" class="btn btn-outline-success px-4">save</a>
            </div>
        </div>
    </div>
</body>
</html>*
