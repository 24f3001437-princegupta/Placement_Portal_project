<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5" style="max-width: 450px;">
        <h3 class="text-center mb-2">Register</h3>
        <p class="text-center text-muted mb-4">Choose your account type and fill in your details</p>

        <div class="btn-group w-100 mb-4" role="group">
            <a href="/register_student" class="btn btn-dark"> Student</a>
            <a href="/register_company" class="btn btn-outline-dark">Company</a>
        </div>

        <form action="/register_student" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="pd" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contact Info (Phone/Email)</label>
                <input type="text" class="form-control" name="contact_info" required>
            </div>
            
            <button type="submit" class="btn btn-dark w-100 mt-2">Register as Student</button>
            <div class="text-center mt-3">
                <p>Already have an account? <a href="/login" class="text-decoration-none">Login</a></p>
            </div>
        </form>
    </div>
</body>
</html>
